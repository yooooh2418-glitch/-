<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>まほうの おえかき ✨</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
  html, body { overflow: hidden; height: 100%; }
  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: linear-gradient(135deg, #ffd6e8 0%, #ffe0f0 25%, #e0d4ff 50%, #d4e8ff 75%, #d4fff0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    color: #5a3a5a;
    position: relative;
  }
  
  .deco {
    position: fixed; pointer-events: none;
    font-size: 26px; opacity: 0.22;
    animation: float 8s ease-in-out infinite; z-index: 0;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-25px) rotate(15deg); }
  }
  
  header { padding: 6px 0 2px; z-index: 2; }
  h1 {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(90deg, #ff6fa8, #ffaa44, #88cc66, #6fb8ff, #b478ff, #ff6fa8);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
    letter-spacing: 2px;
    animation: rainbow-move 4s linear infinite;
  }
  @keyframes rainbow-move { to { background-position: 200% 0; } }
  
  /* メインモード切替 */
  .main-modes {
    display: flex; gap: 6px;
    padding: 4px 8px; z-index: 3;
  }
  .main-mode-btn {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border: 3px solid white;
    border-radius: 20px;
    padding: 6px 14px;
    font-family: inherit; font-weight: 800; font-size: 13px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(255,150,200,0.3);
  }
  .main-mode-btn.active {
    background: linear-gradient(135deg, #ff88bb, #b478ff);
    color: white;
    box-shadow: 0 4px 15px rgba(180,120,255,0.5);
  }
  
  /* サブツールバー */
  .toolbar {
    display: flex; gap: 5px; flex-wrap: wrap;
    justify-content: center; padding: 3px 8px;
    z-index: 2; max-width: 100%;
    min-height: 36px;
  }
  .tool-btn {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border: 3px solid white;
    border-radius: 18px;
    padding: 5px 11px;
    font-family: inherit; font-weight: 700; font-size: 12px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(255,150,200,0.3);
    transition: transform 0.1s;
  }
  .tool-btn:active { transform: scale(0.92); }
  .tool-btn.active {
    background: linear-gradient(135deg, #ff88bb, #b478ff);
    color: white;
  }
  
  /* キャンバスエリア */
  .canvas-wrap {
    flex: 1; width: 100%; max-width: 900px;
    padding: 6px; z-index: 2; position: relative;
  }
  .canvas-stack {
    position: relative;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.85);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(255,150,200,0.4), inset 0 0 30px rgba(255,255,255,0.5);
    border: 4px solid white;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #paint-canvas { z-index: 1; }
  #lineart-canvas { z-index: 2; pointer-events: none; }
  #stamp-canvas { z-index: 3; pointer-events: none; }
  
  /* 下のコントロール */
  .bottom-controls {
    display: flex; gap: 6px; padding: 4px 8px 8px;
    align-items: center; flex-wrap: wrap;
    justify-content: center; z-index: 2;
  }
  
  .size-control {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border: 3px solid white;
    border-radius: 25px;
    padding: 4px 12px;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 10px rgba(255,150,200,0.3);
  }
  .size-control label { font-size: 11px; font-weight: 700; color: #8a5a8a; }
  input[type=range] {
    -webkit-appearance: none;
    width: 80px; height: 5px;
    background: linear-gradient(90deg, #ff88bb, #b478ff);
    border-radius: 5px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    background: white; border: 3px solid #ff88bb;
    border-radius: 50%; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    background: white; border: 3px solid #ff88bb;
    border-radius: 50%; cursor: pointer;
  }
  .size-display {
    width: 24px; text-align: center;
    font-weight: 700; color: #ff4488; font-size: 13px;
  }
  
  .action-btn {
    background: linear-gradient(135deg, #ff88bb, #ff6fa8);
    color: white; border: 3px solid white;
    border-radius: 22px;
    padding: 6px 12px;
    font-family: inherit; font-weight: 700; font-size: 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255,100,170,0.4);
  }
  .action-btn:active { transform: scale(0.93); }
  .action-btn.purple { background: linear-gradient(135deg, #c896ff, #a070ff); }
  .action-btn.green { background: linear-gradient(135deg, #88dd9a, #66cc88); }
  .action-btn.gold { background: linear-gradient(135deg, #ffd888, #ffaa44); }
  
  /* カラーパレット(塗り絵用) */
  .color-palette {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border: 3px solid white;
    border-radius: 22px;
    padding: 5px 8px;
    display: flex; gap: 4px;
    box-shadow: 0 3px 10px rgba(255,150,200,0.3);
  }
  .color-swatch {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid white;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    transition: transform 0.15s;
  }
  .color-swatch:active { transform: scale(0.85); }
  .color-swatch.active {
    transform: scale(1.2);
    border-color: #ff4488;
    box-shadow: 0 0 12px rgba(255,68,136,0.6);
  }
  
  /* キャラ選択モーダル */
  .modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,200,230,0.85);
    backdrop-filter: blur(15px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: white;
    padding: 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255,100,170,0.4);
    border: 4px solid #ffd6e8;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h2 {
    font-size: 22px; color: #ff4488;
    margin-bottom: 15px;
  }
  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 15px;
  }
  .char-card {
    background: linear-gradient(135deg, #fff5fa, #f5e8ff);
    border: 3px solid #ffd6e8;
    border-radius: 18px;
    padding: 10px 6px;
    cursor: pointer;
    transition: transform 0.15s;
    text-align: center;
  }
  .char-card:hover, .char-card:active {
    transform: scale(1.05);
    border-color: #ff88bb;
    box-shadow: 0 4px 15px rgba(255,100,170,0.3);
  }
  .char-card img {
    width: 100%;
    max-height: 100px;
    object-fit: contain;
    border-radius: 10px;
  }
  .char-card .name {
    font-size: 13px; font-weight: 800;
    color: #ff4488;
    margin-top: 4px;
  }
  
  .upload-area {
    background: linear-gradient(135deg, #e8f5ff, #f5e8ff);
    border: 3px dashed #b478ff;
    border-radius: 15px;
    padding: 15px;
    margin-top: 10px;
    cursor: pointer;
  }
  .upload-area input { display: none; }
  
  /* スタンプパネル */
  .stamp-panel {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border: 3px solid white;
    border-radius: 20px;
    padding: 6px;
    display: flex; gap: 4px;
    flex-wrap: wrap;
    max-width: 350px;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(255,150,200,0.3);
  }
  .stamp-btn {
    width: 36px; height: 36px;
    border: 2px solid transparent;
    border-radius: 10px;
    background: white;
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .stamp-btn.active {
    border-color: #ff88bb;
    background: linear-gradient(135deg, #fff5fa, #ffe0f0);
    transform: scale(1.1);
  }
  
  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(135deg, #ffeb88, #ff88bb);
    color: white;
    padding: 18px 30px;
    border-radius: 22px;
    font-size: 20px; font-weight: 800;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    border: 4px solid white;
    z-index: 300; pointer-events: none;
    text-shadow: 2px 2px 0 rgba(255,100,150,0.5);
    white-space: nowrap;
  }
  .toast.show { animation: toast-pop 1.5s ease; }
  @keyframes toast-pop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); }
    20% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
    40% { transform: translate(-50%, -50%) scale(1); }
    80% { transform: translate(-50%, -50%) scale(1); }
    100% { transform: translate(-50%, -50%) scale(0); }
  }
  
  .hide { display: none !important; }
</style>
</head>

function resizeAll() {
  const wrap = paintCanvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  
  // 既存内容をバックアップ
  const backup = (cv) => {
    if (cv.width === 0) return null;
    const t = document.createElement('canvas');
    t.width = cv.width; t.height = cv.height;
    t.getContext('2d').drawImage(cv, 0, 0);
    return t;
  };
  const bp = backup(paintCanvas);
  const bl = backup(lineartCanvas);
  const bs = backup(stampCanvas);
  
  [paintCanvas, lineartCanvas, stampCanvas].forEach(cv => {
    cv.width = rect.width * dpr;
    cv.height = rect.height * dpr;
    cv.style.width = rect.width + 'px';
    cv.style.height = rect.height + 'px';
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.scale(dpr, dpr);
    c.lineCap = 'round';
    c.lineJoin = 'round';
  });
  
  // 復元
  const restore = (cv, b) => {
    if (!b) return;
    const c = cv.getContext('2d');
    c.drawImage(b, 0, 0, cv.width/dpr, cv.height/dpr);
  };
  restore(paintCanvas, bp);
  restore(lineartCanvas, bl);
  restore(stampCanvas, bs);
}
window.addEventListener('resize', resizeAll);
setTimeout(resizeAll, 50);

// ===== 履歴(Undo) =====
function saveSnapshot() {
  if (history.length >= MAX_HISTORY) history.shift();
  // どのキャンバスを記録するか、現在モードで判定
  const target = (mainMode === 'stamp') ? stampCanvas : paintCanvas;
  history.push({ canvas: target, data: target.toDataURL() });
}

function undo() {
  if (history.length === 0) {
    showToast('もどせる絵がないよ♪', '#b478ff');
    return;
  }
  const snap = history.pop();
  const img = new Image();
  img.onload = () => {
    const dpr = window.devicePixelRatio || 1;
    const c = snap.canvas.getContext('2d');
    c.clearRect(0, 0, snap.canvas.width, snap.canvas.height);
    c.drawImage(img, 0, 0, snap.canvas.width/dpr, snap.canvas.height/dpr);
  };
  img.src = snap.data;
}

// ===== 座標取得 =====
function getPos(e) {
  const rect = paintCanvas.getBoundingClientRect();
  let x, y;
  if (e.touches && e.touches[0]) {
    x = e.touches[0].clientX - rect.left;
    y = e.touches[0].clientY - rect.top;
  } else {
    x = e.clientX - rect.left;
    y = e.clientY - rect.top;
  }
  return {x, y};
}

// ===== 入力処理 =====
// ペイントcanvas(下層)がpointer-eventsを受ける。
// ただしモードによって挙動が変わる。
function onStart(e) {
  e.preventDefault();
  const p = getPos(e);
  
  if (mainMode === 'stamp') {
    // スタンプは1タップで配置
    saveSnapshot();
    placeStamp(p.x, p.y);
    return;
  }
  
  if (mainMode === 'color' && colorTool === 'fill') {
    // 塗りつぶし
    saveSnapshot();
    floodFill(p.x, p.y, currentColor);
    return;
  }
  
  drawing = true;
  saveSnapshot();
  lastX = p.x; lastY = p.y;
  drawStroke(lastX, lastY, lastX + 0.1, lastY + 0.1);
}

function onMove(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  drawStroke(lastX, lastY, p.x, p.y);
  lastX = p.x; lastY = p.y;
}

function onEnd() { drawing = false; }

paintCanvas.addEventListener('mousedown', onStart);
paintCanvas.addEventListener('mousemove', onMove);
paintCanvas.addEventListener('mouseup', onEnd);
paintCanvas.addEventListener('mouseleave', onEnd);
paintCanvas.addEventListener('touchstart', onStart, { passive: false });
paintCanvas.addEventListener('touchmove', onMove, { passive: false });
paintCanvas.addEventListener('touchend', onEnd);

// ===== 描画ロジック =====
function drawStroke(x1, y1, x2, y2) {
  const dist = Math.hypot(x2-x1, y2-y1);
  const steps = Math.max(1, Math.ceil(dist / 2));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = x1 + (x2-x1) * t;
    const y = y1 + (y2-y1) * t;
    drawDot(x, y);
  }
  hueShift += dist * 0.5;
}

function drawDot(x, y) {
  if (mainMode === 'color') {
    drawSolid(x, y, currentColor);
    return;
  }
  // 自由お絵描き
  switch(penMode) {
    case 'rainbow': drawRainbow(x, y); break;
    case 'sparkle': drawSparkle(x, y); break;
    case 'flower': drawFlower(x, y); break;
    case 'heart': drawHeart(x, y); break;
    case 'bubble': drawBubble(x, y); break;
    case 'star': drawStar(x, y); break;
    case 'neon': drawNeon(x, y); break;
  }
}

function drawSolid(x, y, color) {
  pctx.fillStyle = color;
  pctx.beginPath();
  pctx.arc(x, y, brushSize/2, 0, Math.PI*2);
  pctx.fill();
}

function drawRainbow(x, y) {
  const hue = (hueShift + x * 0.5 + y * 0.5) % 360;
  const grad = pctx.createRadialGradient(x, y, 0, x, y, brushSize/2);
  grad.addColorStop(0, `hsla(${hue}, 100%, 80%, 1)`);
  grad.addColorStop(0.5, `hsla(${hue}, 100%, 60%, 0.9)`);
  grad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
  pctx.fillStyle = grad;
  pctx.beginPath();
  pctx.arc(x, y, brushSize/2, 0, Math.PI*2);
  pctx.fill();
}

function drawSparkle(x, y) {
  const hue = (hueShift + x * 0.5) % 360;
  pctx.fillStyle = `hsla(${hue}, 100%, 75%, 0.4)`;
  pctx.beginPath();
  pctx.arc(x, y, brushSize/3, 0, Math.PI*2);
  pctx.fill();
  if (Math.random() < 0.3) {
    const ox = x + (Math.random()-0.5) * brushSize * 1.5;
    const oy = y + (Math.random()-0.5) * brushSize * 1.5;
    const size = brushSize * (0.4 + Math.random()*0.6);
    drawStarShape(ox, oy, size, `hsla(${hue}, 100%, 70%, 0.9)`, pctx);
  }
}

function drawFlower(x, y) {
  if (Math.random() > 0.15) return;
  const hue = (hueShift + Math.random()*60) % 360;
  const size = brushSize * (0.8 + Math.random()*0.5);
  pctx.save();
  pctx.translate(x, y);
  pctx.rotate(Math.random() * Math.PI * 2);
  for (let i = 0; i < 5; i++) {
    pctx.rotate((Math.PI*2) / 5);
    const grad = pctx.createRadialGradient(0, -size*0.6, 0, 0, -size*0.6, size*0.6);
    grad.addColorStop(0, `hsla(${hue}, 80%, 90%, 0.9)`);
    grad.addColorStop(1, `hsla(${hue}, 80%, 70%, 0.7)`);
    pctx.fillStyle = grad;
    pctx.beginPath();
    pctx.ellipse(0, -size*0.6, size*0.4, size*0.6, 0, 0, Math.PI*2);
    pctx.fill();
  }
  pctx.fillStyle = `hsla(${(hue+60)%360}, 100%, 70%, 1)`;
  pctx.beginPath();
  pctx.arc(0, 0, size*0.25, 0, Math.PI*2);
  pctx.fill();
  pctx.restore();
}

function drawHeart(x, y) {
  if (Math.random() > 0.2) return;
  const hue = (hueShift + Math.random()*30) % 360;
  const size = brushSize * (0.7 + Math.random()*0.4);
  pctx.save();
  pctx.translate(x, y);
  pctx.rotate((Math.random()-0.5) * 0.5);
  const grad = pctx.createRadialGradient(-size*0.2, -size*0.2, 0, 0, 0, size);
  grad.addColorStop(0, `hsla(${hue}, 100%, 90%, 1)`);
  grad.addColorStop(1, `hsla(${hue}, 100%, 60%, 0.8)`);
  pctx.fillStyle = grad;
  pctx.beginPath();
  pctx.moveTo(0, size*0.3);
  pctx.bezierCurveTo(size, -size*0.4, size*0.5, -size, 0, -size*0.4);
  pctx.bezierCurveTo(-size*0.5, -size, -size, -size*0.4, 0, size*0.3);
  pctx.closePath();
  pctx.fill();
  pctx.restore();
}

function drawBubble(x, y) {
  if (Math.random() > 0.2) return;
  const hue = (hueShift + Math.random()*360) % 360;
  const size = brushSize * (0.6 + Math.random()*0.6);
  const grad = pctx.createRadialGradient(x-size*0.3, y-size*0.3, 0, x, y, size);
  grad.addColorStop(0, `hsla(${hue}, 100%, 95%, 0.8)`);
  grad.addColorStop(0.7, `hsla(${(hue+90)%360}, 80%, 70%, 0.3)`);
  grad.addColorStop(1, `hsla(${(hue+180)%360}, 80%, 60%, 0.5)`);
  pctx.fillStyle = grad;
  pctx.beginPath();
  pctx.arc(x, y, size, 0, Math.PI*2);
  pctx.fill();
  pctx.fillStyle = 'rgba(255,255,255,0.9)';
  pctx.beginPath();
  pctx.arc(x-size*0.35, y-size*0.35, size*0.2, 0, Math.PI*2);
  pctx.fill();
}

function drawStar(x, y) {
  if (Math.random() > 0.18) return;
  const hue = (hueShift + Math.random()*60) % 360;
  const size = brushSize * (0.7 + Math.random()*0.5);
  drawStarShape(x, y, size, `hsla(${hue}, 100%, 70%, 0.9)`, pctx);
}

function drawStarShape(x, y, size, color, ctx) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.random() * Math.PI * 2);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = size;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 / 5) * i - Math.PI/2;
    const x1 = Math.cos(angle) * size;
    const y1 = Math.sin(angle) * size;
    const angle2 = angle + Math.PI/5;
    const x2 = Math.cos(angle2) * size * 0.4;
    const y2 = Math.sin(angle2) * size * 0.4;
    if (i === 0) ctx.moveTo(x1, y1);
    else ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawNeon(x, y) {
  const hue = (hueShift + x*0.3 + y*0.3) % 360;
  pctx.save();
  pctx.fillStyle = `hsla(${hue}, 100%, 60%, 0.3)`;
  pctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
  pctx.shadowBlur = brushSize * 1.5;
  pctx.beginPath();
  pctx.arc(x, y, brushSize/2.5, 0, Math.PI*2);
  pctx.fill();
  pctx.shadowBlur = 0;
  pctx.fillStyle = `hsla(${hue}, 100%, 95%, 1)`;
  pctx.beginPath();
  pctx.arc(x, y, brushSize/4, 0, Math.PI*2);
  pctx.fill();
  pctx.restore();
}

// ===== スタンプ =====
function placeStamp(x, y) {
  const size = brushSize * 2;
  sctx.save();
  sctx.translate(x, y);
  sctx.rotate((Math.random()-0.5) * 0.3);
  sctx.font = `${size}px serif`;
  sctx.textAlign = 'center';
  sctx.textBaseline = 'middle';
  sctx.fillText(currentStamp, 0, 0);
  sctx.restore();
}

// ===== 塗りつぶし(バケツ) =====
function floodFill(sx, sy, hexColor) {
  const dpr = window.devicePixelRatio || 1;
  const cw = paintCanvas.width;
  const ch = paintCanvas.height;
  // 実座標
  const startX = Math.floor(sx * dpr);
  const startY = Math.floor(sy * dpr);
  
  // 線画レイヤーと合成して、線部分は塗らないようにする
  // まず塗り対象のピクセルデータを取得
  const imgData = pctx.getImageData(0, 0, cw, ch);
  const data = imgData.data;
  
  // 線画も読む
  let lineData = null;
  if (hasLineart) {
    lineData = lctx.getImageData(0, 0, cw, ch).data;
  }
  
  const idx = (x, y) => (y * cw + x) * 4;
  const startIdx = idx(startX, startY);
  const sr = data[startIdx], sg = data[startIdx+1], sb = data[startIdx+2], sa = data[startIdx+3];
  
  // 色変換
  const hex = hexColor.replace('#','');
  const tr = parseInt(hex.substr(0,2), 16);
  const tg = parseInt(hex.substr(2,2), 16);
  const tb = parseInt(hex.substr(4,2), 16);
  
  // 同じ色なら何もしない
  if (sr === tr && sg === tg && sb === tb && sa === 255) return;
  
  // 線画の暗さでマスク(暗い=線、なので塗らない)
  function isLine(i) {
    if (!lineData) return false;
    const r = lineData[i], g = lineData[i+1], b = lineData[i+2], a = lineData[i+3];
    if (a < 50) return false; // 透明部分は線じゃない
    const lum = (r + g + b) / 3;
    return lum < 180; // 暗いほど線
  }
  
  // 起点が透明かどうかで色一致の判定方法を変える
  const startIsTransparent = sa < 30;
  
  function matches(i) {
    const da = data[i+3];
    if (startIsTransparent) {
      // 起点が透明 → 透明 or 同じターゲット色以外のピクセルにマッチ
      return da < 30;
    } else {
      // 起点が不透明 → 色が近いものにマッチ
      const dr = data[i] - sr;
      const dg = data[i+1] - sg;
      const db = data[i+2] - sb;
      const dAlpha = da - sa;
      return dr*dr + dg*dg + db*db + dAlpha*dAlpha < 4000;
    }
  }
  
  // BFS スキャンライン塗りつぶし
  const stack = [[startX, startY]];
  const visited = new Uint8Array(cw * ch);
  let count = 0;
  const MAX_PIXELS = cw * ch;
  
  while (stack.length > 0 && count < MAX_PIXELS) {
    const [x, y] = stack.pop();
    if (x < 0 || x >= cw || y < 0 || y >= ch) continue;
    const vIdx = y * cw + x;
    if (visited[vIdx]) continue;
    
    const i = vIdx * 4;
    // 線画上は塗らない
    if (isLine(i)) continue;
    
    // 元の色と一致するか判定
    if (!matches(i)) continue;
    
    visited[vIdx] = 1;
    data[i] = tr;
    data[i+1] = tg;
    data[i+2] = tb;
    data[i+3] = 255;
    count++;
    
    stack.push([x+1, y]);
    stack.push([x-1, y]);
    stack.push([x, y+1]);
    stack.push([x, y-1]);
  }
  
  pctx.putImageData(imgData, 0, 0);
}

// ===== 線画化(画像を白黒のアウトラインに変換) =====
// canvas全体を走査して、暗い部分→黒、明るい部分→透明 にする
let lineartMode = true; // 線画化するか

function convertToLineart() {
  const dpr = window.devicePixelRatio || 1;
  const w = lineartCanvas.width;
  const h = lineartCanvas.height;
  
  const imgData = lctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
    if (a < 30) continue; // 透明はスキップ
    
    const lum = (r + g + b) / 3;
    
    if (lum < 180) {
      // 線部分: 暗さに応じて黒〜濃灰色
      const k = Math.max(0, Math.min(80, lum - 30));
      data[i] = k; data[i+1] = k; data[i+2] = k; data[i+3] = 255;
    } else {
      // 背景部分: 透明にする(下のpaintCanvasが見えるように)
      data[i+3] = 0;
    }
  }
  
  lctx.putImageData(imgData, 0, 0);
}

// ===== ぬりえテンプレ読み込み =====
function loadTemplate(src) {
  const img = new Image();
  img.onload = () => {
    clearAll();
    
    const dpr = window.devicePixelRatio || 1;
    const cw = lineartCanvas.width / dpr;
    const ch = lineartCanvas.height / dpr;
    
    // アスペクト維持
    const scale = Math.min(cw / img.width, ch / img.height) * 0.95;
    const dw = img.width * scale;
    const dh = img.height * scale;
    const dx = (cw - dw) / 2;
    const dy = (ch - dh) / 2;
    
    lctx.drawImage(img, dx, dy, dw, dh);
    
    // 線画化モードがONなら変換
    if (lineartMode) {
      convertToLineart();
    }
    
    hasLineart = true;
    
    // 自動でぬりえモードへ
    document.querySelectorAll('.main-mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-main="color"]').classList.add('active');
    mainMode = 'color';
    updateUI();
    
    showToast('ぬりえじゅんびOK♡', '#ff6fa8');
  };
  img.onerror = () => {
    showToast('えがよめなかったよ💦', '#ff6fa8');
  };
  img.src = src;
}

// 線画モード切替
let _lastTemplate = null;
const origImage = new Image();
document.getElementById('lineart-toggle').onclick = () => {
  const btn = document.getElementById('lineart-toggle');
  lineartMode = !lineartMode;
  btn.classList.toggle('active', lineartMode);
  btn.textContent = lineartMode ? '⚫ せんがか' : '🎨 カラー';
  
  // 既に表示中のテンプレを再変換
  if (_lastTemplate) {
    loadTemplate(_lastTemplate);
  } else {
    showToast(lineartMode ? '⚫ せんがかモード!' : '🎨 カラーモード!', '#b478ff');
  }
};

// 元のテンプレを覚えておく(切替用)
const _origLoadTemplate = loadTemplate;

function clearAll() {
  const dpr = window.devicePixelRatio || 1;
  pctx.clearRect(0, 0, paintCanvas.width/dpr, paintCanvas.height/dpr);
  lctx.clearRect(0, 0, lineartCanvas.width/dpr, lineartCanvas.height/dpr);
  sctx.clearRect(0, 0, stampCanvas.width/dpr, stampCanvas.height/dpr);
  hasLineart = false;
  history = [];
}

// ===== キャラ選択モーダル =====
function openCharModal() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  CHAR_DATA.forEach(c => {
    const card = document.createElement('div');
    card.className = 'char-card';
    const hasImg = CHAR_IMAGES[c.id];
    if (hasImg) {
      card.innerHTML = `<img src="${CHAR_IMAGES[c.id]}" alt="${c.name}"><div class="name">${c.emoji} ${c.name}</div>`;
    } else {
      card.innerHTML = `<div style="font-size:60px;">${c.emoji}</div><div class="name">${c.name}</div>`;
    }
    card.onclick = () => {
      if (hasImg) {
        _lastTemplate = CHAR_IMAGES[c.id];
        loadTemplate(CHAR_IMAGES[c.id]);
        closeCharModal();
      } else {
        showToast('じゅんびちゅう...', '#b478ff');
      }
    };
    grid.appendChild(card);
  });
  document.getElementById('char-modal').classList.add('show');
}

function closeCharModal() {
  document.getElementById('char-modal').classList.remove('show');
}

document.getElementById('pick-template').onclick = openCharModal;

// アップロード
document.getElementById('upload-area').onclick = () => {
  document.getElementById('upload-input').click();
};
document.getElementById('upload-input').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    _lastTemplate = ev.target.result;
    loadTemplate(ev.target.result);
    closeCharModal();
  };
  reader.readAsDataURL(file);
};

// ===== ボタン =====
document.getElementById('size').oninput = e => {
  brushSize = +e.target.value;
  document.getElementById('size-display').textContent = brushSize;
};

document.getElementById('undo').onclick = undo;

document.getElementById('clear').onclick = () => {
  if (mainMode === 'stamp') {
    const dpr = window.devicePixelRatio || 1;
    sctx.clearRect(0, 0, stampCanvas.width/dpr, stampCanvas.height/dpr);
  } else {
    const dpr = window.devicePixelRatio || 1;
    pctx.clearRect(0, 0, paintCanvas.width/dpr, paintCanvas.height/dpr);
  }
  showToast('けしたよ♪', '#88dd9a');
};

document.getElementById('save').onclick = () => {
  const out = document.createElement('canvas');
  out.width = paintCanvas.width;
  out.height = paintCanvas.height;
  const octx = out.getContext('2d');
  octx.fillStyle = 'white';
  octx.fillRect(0, 0, out.width, out.height);
  octx.drawImage(paintCanvas, 0, 0);
  octx.drawImage(lineartCanvas, 0, 0);
  octx.drawImage(stampCanvas, 0, 0);
  
  const link = document.createElement('a');
  link.download = `おえかき_${Date.now()}.png`;
  link.href = out.toDataURL('image/png');
  link.click();
  showToast('ほぞんしたよ♡', '#ffaa44');
};

function showToast(text, color) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.style.background = `linear-gradient(135deg, ${color}, #ffaadd)`;
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
}

// 初期化
updateUI();
</script>
