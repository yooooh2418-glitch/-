<title>スイーツ パズル ♡</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&amp;family=Fredoka:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: 'M PLUS Rounded 1c', 'Fredoka', sans-serif;
    background: linear-gradient(135deg, #ffd6e8 0%, #ffe0f0 30%, #e0d4ff 70%, #d4e8ff 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    padding: 10px;
    color: #5a3a5a;
  }
  .deco {
    position: fixed;
    pointer-events: none;
    font-size: 30px;
    opacity: 0.3;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }
  header {
    text-align: center;
    margin: 10px 0 15px;
    position: relative;
    z-index: 2;
  }
  h1 {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(90deg, #ff6fa8, #b478ff, #6fb8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
    letter-spacing: 2px;
  }
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
    z-index: 2;
  }
  .stat-card {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 8px 16px;
    box-shadow: 0 4px 12px rgba(255,150,200,0.3);
    border: 2px solid white;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
  }
  .stat-card .label { font-size: 11px; color: #a070a0; }
  .stat-card .value { font-size: 20px; color: #ff4488; }
  #board-wrap {
    position: relative;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 12px;
    box-shadow: 0 10px 40px rgba(255,150,200,0.4), inset 0 0 20px rgba(255,255,255,0.5);
    border: 3px solid rgba(255,255,255,0.8);
  }
  svg#board { display: block; border-radius: 20px; }
  .cell { transition: transform 0.2s ease; cursor: pointer; }
  .cell.selected .candy-bg {
    stroke: #ff4488;
    stroke-width: 4;
    filter: drop-shadow(0 0 12px #ff88bb);
  }
  @keyframes sparkle {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
    100% { transform: scale(0) rotate(360deg); opacity: 0; }
  }
  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }
  @keyframes drop {
    from { transform: translateY(-50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .controls {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    z-index: 2;
  }
  button {
    background: linear-gradient(135deg, #ff88bb, #ff6fa8);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 30px;
    font-family: inherit;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,100,170,0.4);
    border: 3px solid white;
    transition: transform 0.15s;
  }
  button:active { transform: scale(0.95); }
  button.purple { background: linear-gradient(135deg, #c896ff, #a070ff); box-shadow: 0 4px 15px rgba(180,130,255,0.4); }
  .cheer {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(135deg, #ffeb88, #ff88bb);
    color: white;
    padding: 30px 50px;
    border-radius: 30px;
    font-size: 36px;
    font-weight: 800;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border: 4px solid white;
    z-index: 100;
    pointer-events: none;
    text-shadow: 2px 2px 0 rgba(255,100,150,0.5);
  }
  .cheer.show { animation: cheer-pop 1.2s ease; }
  @keyframes cheer-pop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); }
    50% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
    100% { transform: translate(-50%, -50%) scale(0) rotate(0deg); }
  }
  .modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,200,230,0.7);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: white;
    padding: 40px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255,100,170,0.4);
    border: 4px solid #ffd6e8;
    max-width: 320px;
  }
  .modal-box h2 { font-size: 28px; color: #ff4488; margin-bottom: 15px; }
  .modal-box p { font-size: 16px; color: #8a5a8a; margin-bottom: 20px; line-height: 1.6; }
  .star-bar { display: flex; gap: 5px; margin-bottom: 10px; z-index: 2; }
  .star { font-size: 28px; filter: grayscale(1); opacity: 0.3; transition: all 0.5s; }
  .star.lit { filter: grayscale(0); opacity: 1; animation: bounce 1s ease infinite; }
</style>
</head>
<body>
<div class="deco" style="top:5%;left:5%;">🌸</div>

="6" data-c="3" style="transform: translate(150px, 300px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g2)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍇</text></g><g class="cell" data-r="6" data-c="4" style="transform: translate(200px, 300px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g3)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍋</text></g><g class="cell" data-r="6" data-c="5" style="transform: translate(250px, 300px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g2)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍇</text></g><g class="cell" data-r="6" data-c="6" style="transform: translate(300px, 300px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g0)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍓</text></g><g class="cell" data-r="6" data-c="7" style="transform: translate(350px, 300px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g4)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍏</text></g><g class="cell" data-r="7" data-c="0" style="transform: translate(0px, 350px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g2)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍇</text></g><g class="cell" data-r="7" data-c="1" style="transform: translate(50px, 350px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g0)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍓</text></g><g class="cell" data-r="7" data-c="2" style="transform: translate(100px, 350px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g5)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍑</text></g><g class="cell" data-r="7" data-c="3" style="transform: translate(150px, 350px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g4)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍏</text></g><g class="cell" data-r="7" data-c="4" style="transform: translate(200px, 350px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g1)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🫐</text></g><g class="cell" data-r="7" data-c="5" style="transform: translate(250px, 350px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g2)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍇</text></g><g class="cell" data-r="7" data-c="6" style="transform: translate(300px, 350px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g2)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍇</text></g><g class="cell" data-r="7" data-c="7" style="transform: translate(350px, 350px);"><circle class="candy-bg" cx="25" cy="25" r="22" fill="url(#g4)" filter="url(#shadow)"></circle><ellipse cx="18" cy="16" rx="6" ry="4" fill="rgba(255,255,255,0.7)"></ellipse><text x="25" y="33" text-anchor="middle" font-size="24" style="pointer-events: none;">🍏</text></g></g>
    <g id="effects"></g>

</div>

<div class="controls">
  <button id="hint-btn">💡 ヒント</button>
  <button id="reset-btn" class="purple">🔄 やりなおし</button>
</div>

<div class="cheer" id="cheer"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modal-title">レベル クリア！</h2>
    <p id="modal-msg">すごいね！つぎのレベルにすすもう♪</p>
    <button onclick="nextLevel()">つぎへ ▶</button>
  </div>
</div>

<script>
const ROWS = 8, COLS = 8, SIZE = 50;
const CANDY_TYPES = [
  { id: 0, emoji: '🍓', name: 'いちご' },
  { id: 1, emoji: '🫐', name: 'ブルーベリー' },
  { id: 2, emoji: '🍇', name: 'ぶどう' },
  { id: 3, emoji: '🍋', name: 'レモン' },
  { id: 4, emoji: '🍏', name: 'りんご' },
  { id: 5, emoji: '🍑', name: 'もも' }
];

let board = [];
let score = 0;
let level = 1;
let target = 30;
let selected = null;
let busy = false;
let stars = 0;

const svg = document.getElementById('board');
const candiesG = document.getElementById('candies');
const effectsG = document.getElementById('effects');

function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let type;
      do {
        type = Math.floor(Math.random() * CANDY_TYPES.length);
      } while (
        (c >= 2 && board[r][c-1] === type && board[r][c-2] === type) ||
        (r >= 2 && board[r-1][c] === type && board[r-2][c] === type)
      );
      board[r][c] = type;
    }
  }
}

function render() {
  candiesG.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] === null) continue;
      const t = board[r][c];
      const cx = c * SIZE + SIZE/2;
      const cy = r * SIZE + SIZE/2;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'cell');
      g.setAttribute('data-r', r);
      g.setAttribute('data-c', c);
      g.style.transform = `translate(${cx-25}px, ${cy-25}px)`;
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      bg.setAttribute('class', 'candy-bg');
      bg.setAttribute('cx', 25);
      bg.setAttribute('cy', 25);
      bg.setAttribute('r', 22);
      bg.setAttribute('fill', `url(#g${t})`);
      bg.setAttribute('filter', 'url(#shadow)');
      g.appendChild(bg);
      const hl = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      hl.setAttribute('cx', 18);
      hl.setAttribute('cy', 16);
      hl.setAttribute('rx', 6);
      hl.setAttribute('ry', 4);
      hl.setAttribute('fill', 'rgba(255,255,255,0.7)');
      g.appendChild(hl);
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', 25);
      text.setAttribute('y', 33);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-size', '24');
      text.textContent = CANDY_TYPES[t].emoji;
      text.style.pointerEvents = 'none';
      g.appendChild(text);
      if (selected && selected.r === r && selected.c === c) {
        g.classList.add('selected');
      }
      g.onclick = () => onCellClick(r, c);
      g.ontouchstart = (e) => { e.preventDefault(); onCellClick(r, c); };
      candiesG.appendChild(g);
    }
  }
}

function findMatches() {
  const matched = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  for (let r = 0; r < ROWS; r++) {
    let count = 1;
    for (let c = 1; c <= COLS; c++) {
      if (c < COLS && board[r][c] !== null && board[r][c] === board[r][c-1]) {
        count++;
      } else {
        if (count >= 3) {
          for (let k = 1; k <= count; k++) matched[r][c-k] = true;
        }
        count = 1;
      }
    }
  }
  for (let c = 0; c < COLS; c++) {
    let count = 1;
    for (let r = 1; r <= ROWS; r++) {
      if (r < ROWS && board[r] && board[r][c] !== null && board[r][c] === board[r-1][c]) {
        count++;
      } else {
        if (count >= 3) {
          for (let k = 1; k <= count; k++) matched[r-k][c] = true;
        }
        count = 1;
      }
    }
  }
  const result = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (matched[r][c]) result.push({r, c});
    }
  }
  return result;
}

async function onCellClick(r, c) {
  if (busy) return;
  if (!selected) {
    selected = {r, c};
    render();
    return;
  }
  const dr = Math.abs(selected.r - r);
  const dc = Math.abs(selected.c - c);
  if (dr + dc !== 1) {
    selected = {r, c};
    render();
    return;
  }
  busy = true;
  const a = {...selected};
  const b = {r, c};
  selected = null;
  swap(a, b);
  render();
  await sleep(200);
  const matches = findMatches();
  if (matches.length === 0) {
    await sleep(100);
    swap(a, b);
    render();
    showCheer('もう一度♪', '#b478ff');
    busy = false;
    return;
  }
  await processMatches();
  busy = false;
  checkGoal();
}

function swap(a, b) {
  const tmp = board[a.r][a.c];
  board[a.r][a.c] = board[b.r][b.c];
  board[b.r][b.c] = tmp;
}

async function processMatches() {
  let combo = 0;
  while (true) {
    const matches = findMatches();
    if (matches.length === 0) break;
    combo++;
    for (const {r, c} of matches) {
      spawnSparkle(c * SIZE + 25, r * SIZE + 25);
      board[r][c] = null;
    }
    const gained = matches.length * 10 * combo;
    score += gained;
    document.getElementById('score').textContent = score;
    if (combo >= 2) showCheer(`コンボ ×${combo}!`, '#ff4488');
    else if (matches.length >= 4) showCheer('すごい!', '#ffaa44');
    else showCheer('やったね♪', '#88cc66');
    render();
    await sleep(400);
    for (let c = 0; c < COLS; c++) {
      let writePtr = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          board[writePtr][c] = board[r][c];
          if (writePtr !== r) board[r][c] = null;
          writePtr--;
        }
      }
      for (let r = writePtr; r >= 0; r--) {
        board[r][c] = Math.floor(Math.random() * CANDY_TYPES.length);
      }
    }
    render();
    await sleep(300);
  }
}

function spawnSparkle(x, y) {
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI * 2 / 6) * i;
    const sparkle = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    sparkle.setAttribute('x', x);
    sparkle.setAttribute('y', y);
    sparkle.setAttribute('text-anchor', 'middle');
    sparkle.setAttribute('font-size', '20');
    sparkle.textContent = ['✨', '⭐', '💖', '🌟'][Math.floor(Math.random()*4)];
    const tx = Math.cos(angle) * 40;
    const ty = Math.sin(angle) * 40;
    sparkle.style.transition = 'transform 0.6s ease-out, opacity 0.6s';
    effectsG.appendChild(sparkle);
    requestAnimationFrame(() => {
      sparkle.style.transform = `translate(${tx}px, ${ty}px) scale(1.5)`;
      sparkle.style.opacity = '0';
    });
    setTimeout(() => sparkle.remove(), 700);
  }
}

function showCheer(text, color) {
  const c = document.getElementById('cheer');
  c.textContent = text;
  c.style.background = `linear-gradient(135deg, ${color}, #ffaadd)`;
  c.classList.remove('show');
  void c.offsetWidth;
  c.classList.add('show');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function checkGoal() {
  const newStars = Math.min(3, Math.floor(score / (target / 3)));
  if (newStars > stars) {
    stars = newStars;
    updateStars();
  }
  if (score >= target) {
    setTimeout(() => {
      document.getElementById('modal-title').textContent = `レベル ${level} クリア！⭐`;
      document.getElementById('modal-msg').textContent = `スコア: ${score}点！${'⭐'.repeat(stars)}`;
      document.getElementById('modal').classList.add('show');
    }, 800);
  }
}

function updateStars() {
  const ss = document.querySelectorAll('.star');
  ss.forEach((s, i) => {
    if (i < stars) s.classList.add('lit');
    else s.classList.remove('lit');
  });
}

function nextLevel() {
  level++;
  target = Math.floor(target * 1.5);
  stars = 0;
  updateStars();
  document.getElementById('level').textContent = level;
  document.getElementById('modal').classList.remove('show');
  initBoard();
  render();
}

function showHint() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tries = [[0,1],[1,0]];
      for (const [dr, dc] of tries) {
        const nr = r + dr, nc = c + dc;
        if (nr >= ROWS || nc >= COLS) continue;
        swap({r,c}, {r:nr,c:nc});
        const m = findMatches();
        swap({r,c}, {r:nr,c:nc});
        if (m.length > 0) {
          highlightHint(r, c, nr, nc);
          return;
        }
      }
    }
  }
  showCheer('じゅんびちゅう...', '#b478ff');
}

function highlightHint(r1, c1, r2, c2) {
  const cells = document.querySelectorAll('.cell');
  cells.forEach(cell => {
    const cr = +cell.dataset.r, cc = +cell.dataset.c;
    if ((cr===r1&&cc===c1) || (cr===r2&&cc===c2)) {
      const circle = cell.querySelector('.candy-bg');
      circle.setAttribute('stroke', '#ffaa00');
      circle.setAttribute('stroke-width', '4');
      circle.style.filter = 'drop-shadow(0 0 15px #ffcc00)';
      setTimeout(() => {
        circle.removeAttribute('stroke');
        circle.style.filter = '';
      }, 1500);
    }
  });
}

document.getElementById('hint-btn').onclick = showHint;
document.getElementById('reset-btn').onclick = () => {
  score = 0;
  stars = 0;
  document.getElementById('score').textContent = '0';
  updateStars();
  initBoard();
  render();
  showCheer('やりなおし♪', '#b478ff');
};

initBoard();
render();
</script>
